<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CinemaBot Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --accent: #e50914;
      --accent2: #ff6b35;
      --text: #f0f0f0;
      --muted: #888;
      --border: #2a2a2a;
      --radius: 10px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ── */
    #header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      min-height: 52px;
    }

    #header .logo { font-size: 20px; }

    #title-wrap { flex: 1; overflow: hidden; }
    #media-title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #media-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    #close-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 22px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      flex-shrink: 0;
    }

    /* ── Player container ── */
    #player-wrap {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    #player-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── Loading overlay ── */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      gap: 16px;
      z-index: 10;
      transition: opacity 0.3s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading p { color: var(--muted); font-size: 13px; }

    /* ── Bottom bar ── */
    #bottom-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .provider-btn {
      flex: 1;
      padding: 10px 6px;
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .provider-btn.active {
      border-color: var(--accent);
      background: rgba(229, 9, 20, 0.15);
      color: #fff;
    }
    .provider-btn:not(.active):hover {
      border-color: #444;
      background: rgba(255,255,255,0.05);
    }

    .provider-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      display: none;
    }
    .provider-btn.active .provider-dot { display: block; }

    /* ── Error state ── */
    #error-screen {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      gap: 12px;
      padding: 24px;
      text-align: center;
      z-index: 20;
    }
    #error-screen.visible { display: flex; }
    #error-screen .icon { font-size: 48px; }
    #error-screen h3 { font-size: 16px; }
    #error-screen p { font-size: 13px; color: var(--muted); }
    #try-alt-btn {
      margin-top: 8px;
      padding: 10px 24px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div id="app">

  <div id="header">
    <span class="logo">🎬</span>
    <div id="title-wrap">
      <div id="media-title">Carregando…</div>
      <div id="media-sub"></div>
    </div>
    <button id="close-btn" title="Fechar">✕</button>
  </div>

  <div id="player-wrap">
    <div id="loading">
      <div class="spinner"></div>
      <p>Carregando player…</p>
    </div>
    <div id="error-screen">
      <div class="icon">😕</div>
      <h3>Player indisponível</h3>
      <p>Este conteúdo não está disponível neste player no momento.</p>
      <button id="try-alt-btn">Tentar Player Alternativo</button>
    </div>
    <iframe
      id="player-frame"
      allowfullscreen
      allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
      referrerpolicy="no-referrer"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"
    ></iframe>
  </div>

  <div id="bottom-bar">
    <button class="provider-btn active" data-provider="2embed" onclick="switchProvider('2embed')">
      <span class="provider-dot"></span>
      🎬 2Embed
    </button>
    <button class="provider-btn" data-provider="vidsrc" onclick="switchProvider('vidsrc')">
      <span class="provider-dot"></span>
      📡 VidSrc
    </button>
    <button class="provider-btn" data-provider="vidsrcme" onclick="switchProvider('vidsrcme')">
      <span class="provider-dot"></span>
      🌐 VidSrc.me
    </button>
  </div>

</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor("#1a1a1a");
    tg.setBackgroundColor("#0d0d0d");
  }

  // ── Parsear parâmetros da URL ──────────────────────────────
  const params = new URLSearchParams(window.location.search);
  const mediaType    = params.get("type") || "movie";  // "movie" | "tv"
  const tmdbId       = params.get("id")   || "";
  const season       = params.get("s")    || "1";
  const episode      = params.get("e")    || "1";
  const title        = decodeURIComponent(params.get("title") || "");
  const seasonEpInfo = mediaType === "tv"
    ? `T${season.padStart(2,"0")} · E${episode.padStart(2,"0")}`
    : "";

  // ── Preencher header ──────────────────────────────────────
  document.getElementById("media-title").textContent = title || "Player";
  document.getElementById("media-sub").textContent   = seasonEpInfo;

  // ── Construir URLs por provider ───────────────────────────
  function buildUrl(provider) {
    switch (provider) {
      case "2embed":
        return mediaType === "movie"
          ? `https://www.2embed.to/embed/tmdb/movie?id=${tmdbId}`
          : `https://www.2embed.to/embed/tmdb/tv?id=${tmdbId}&s=${season}&e=${episode}`;
      case "vidsrc":
        return mediaType === "movie"
          ? `https://vidsrc.to/embed/movie/${tmdbId}`
          : `https://vidsrc.to/embed/tv/${tmdbId}/${season}/${episode}`;
      case "vidsrcme":
        return mediaType === "movie"
          ? `https://vidsrc.me/embed/movie?tmdb=${tmdbId}`
          : `https://vidsrc.me/embed/tv?tmdb=${tmdbId}&season=${season}&episode=${episode}`;
      default:
        return "";
    }
  }

  // ── Estado atual ──────────────────────────────────────────
  let currentProvider = "2embed";
  let loadTimer = null;

  function showLoading() {
    document.getElementById("loading").classList.remove("hidden");
    document.getElementById("error-screen").classList.remove("visible");
  }

  function hideLoading() {
    document.getElementById("loading").classList.add("hidden");
  }

  function showError() {
    hideLoading();
    document.getElementById("error-screen").classList.add("visible");
  }

  function loadPlayer(provider) {
    const url = buildUrl(provider);
    if (!url || !tmdbId) { showError(); return; }

    showLoading();
    clearTimeout(loadTimer);

    const frame = document.getElementById("player-frame");
    frame.src = url;

    // Timeout de 15s — se iframe não carregar, mostra erro
    loadTimer = setTimeout(() => {
      // Só mostra erro se ainda está no loading (iframe não disparou onload)
      if (!document.getElementById("loading").classList.contains("hidden")) {
        // Não mostramos erro direto pois iframes cross-origin não disparam erro
        hideLoading();
      }
    }, 15000);
  }

  function switchProvider(provider) {
    if (provider === currentProvider) return;
    currentProvider = provider;

    // Atualizar botões
    document.querySelectorAll(".provider-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.provider === provider);
    });

    loadPlayer(provider);
  }

  // ── Evento iframe load ────────────────────────────────────
  document.getElementById("player-frame").addEventListener("load", () => {
    clearTimeout(loadTimer);
    hideLoading();
  });

  // ── Botão alternativo no erro ─────────────────────────────
  document.getElementById("try-alt-btn").addEventListener("click", () => {
    const next = currentProvider === "2embed" ? "vidsrc" : "vidsrcme";
    document.querySelectorAll(".provider-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.provider === next);
    });
    currentProvider = next;
    loadPlayer(next);
  });

  // ── Fechar Mini App ───────────────────────────────────────
  document.getElementById("close-btn").addEventListener("click", () => {
    if (tg) tg.close();
  });

  // ── Inicializar ───────────────────────────────────────────
  if (tmdbId) {
    loadPlayer("2embed");
  } else {
    showError();
  }
</script>
</body>
</html>
