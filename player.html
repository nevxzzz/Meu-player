<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CinemaBot Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0d0d0d; --surface:#1a1a1a; --accent:#e50914;
      --text:#f0f0f0; --muted:#888; --border:#2a2a2a; --radius:10px;
    }
    html,body { height:100%; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; overflow:hidden; }
    #app { display:flex; flex-direction:column; height:100vh; }

    #header { display:flex; align-items:center; gap:10px; padding:10px 14px;
      background:var(--surface); border-bottom:1px solid var(--border);
      flex-shrink:0; min-height:52px; }
    #header .logo { font-size:20px; }
    #title-wrap { flex:1; overflow:hidden; }
    #media-title { font-size:14px; font-weight:700; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; }
    #media-sub { font-size:11px; color:var(--muted); margin-top:2px; }
    #close-btn { background:none; border:none; color:var(--muted); font-size:22px;
      cursor:pointer; padding:4px; line-height:1; flex-shrink:0; }

    #player-wrap { flex:1; position:relative; background:#000; overflow:hidden; }
    #player-frame { width:100%; height:100%; border:none; display:block; }

    #loading { position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; background:#000;
      gap:16px; z-index:10; transition:opacity 0.3s; }
    #loading.hidden { opacity:0; pointer-events:none; }
    .spinner { width:44px; height:44px; border:3px solid var(--border);
      border-top-color:var(--accent); border-radius:50%;
      animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    #loading p { color:var(--muted); font-size:13px; }

    #bottom-bar { background:var(--surface); border-top:1px solid var(--border);
      padding:8px 12px; display:flex; gap:8px; flex-shrink:0; }
    .provider-btn { flex:1; padding:10px 6px; border-radius:var(--radius);
      border:1.5px solid var(--border); background:transparent; color:var(--text);
      font-size:12px; font-weight:600; cursor:pointer; display:flex;
      align-items:center; justify-content:center; gap:5px; transition:all 0.2s; }
    .provider-btn.active { border-color:var(--accent); background:rgba(229,9,20,0.15); color:#fff; }
    .provider-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); display:none; }
    .provider-btn.active .provider-dot { display:block; }

    #error-screen { display:none; position:absolute; inset:0; flex-direction:column;
      align-items:center; justify-content:center; background:#000;
      gap:12px; padding:24px; text-align:center; z-index:20; }
    #error-screen.visible { display:flex; }
    #error-screen .icon { font-size:48px; }
    #error-screen h3 { font-size:16px; }
    #error-screen p { font-size:13px; color:var(--muted); }
    #try-alt-btn { margin-top:8px; padding:10px 24px; background:var(--accent);
      color:#fff; border:none; border-radius:var(--radius); font-size:13px; font-weight:700; cursor:pointer; }

    /* ── DEBUG PANEL (temporário — remova quando resolver) ── */
    #dbg-btn {
      position:fixed; bottom:68px; right:8px; z-index:999;
      background:#ff6b00dd; color:#fff; border:none; border-radius:8px;
      padding:7px 11px; font-size:11px; font-weight:800; cursor:pointer;
      letter-spacing:.5px;
    }
    #dbg-panel {
      display:none; position:fixed; bottom:105px; left:6px; right:6px; z-index:998;
      background:#111f; border:1.5px solid #ff6b00; border-radius:10px;
      padding:10px 12px; max-height:54vh; overflow-y:auto;
    }
    #dbg-panel.open { display:block; }
    #dbg-panel h4 { color:#ff6b00; font-size:12px; margin-bottom:6px;
      display:flex; justify-content:space-between; }
    #dbg-panel h4 button { background:none; border:none; color:#888;
      font-size:11px; cursor:pointer; }
    #dbg-info { font-size:10.5px; color:#ccc; line-height:1.7;
      word-break:break-all; white-space:pre-wrap; }
    #dbg-events { margin-top:8px; }
    .de { font-size:10px; line-height:1.6; word-break:break-all; }
    .de-ok  { color:#66bb6a; }
    .de-err { color:#ef5350; }
    .de-inf { color:#64b5f6; }
    .de-warn{ color:#ffa726; }
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    <span class="logo">🎬</span>
    <div id="title-wrap">
      <div id="media-title">Carregando…</div>
      <div id="media-sub"></div>
    </div>
    <button id="close-btn">✕</button>
  </div>

  <div id="player-wrap">
    <div id="loading">
      <div class="spinner"></div>
      <p>Carregando player…</p>
    </div>
    <div id="error-screen">
      <div class="icon">😕</div>
      <h3>Player indisponível</h3>
      <p>Tente o player alternativo abaixo.</p>
      <button id="try-alt-btn">Tentar Alternativo</button>
    </div>
    <iframe id="player-frame"
      allowfullscreen
      allow="autoplay *; encrypted-media *; picture-in-picture *; fullscreen *; clipboard-write *; accelerometer *; gyroscope *"
      referrerpolicy="no-referrer"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"
    ></iframe>
  </div>

  <div id="bottom-bar">
    <button class="provider-btn active" data-provider="warezcdn" onclick="switchProvider('warezcdn')">
      <span class="provider-dot"></span>🎬 WarezCDN
    </button>
    <button class="provider-btn" data-provider="superflix" onclick="switchProvider('superflix')">
      <span class="provider-dot"></span>📡 SuperFlix
    </button>
  </div>
</div>

<!-- DEBUG PANEL -->
<button id="dbg-btn" onclick="toggleDebug()">🐛 DEBUG</button>
<div id="dbg-panel">
  <h4>
    🐛 Debug Log
    <button onclick="clearDebug()">limpar</button>
  </h4>
  <div id="dbg-info">aguardando…</div>
  <div id="dbg-events"></div>
</div>

<script>
  // ── Telegram WebApp ──────────────────────────────────────────────
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor("#1a1a1a"); tg.setBackgroundColor("#0d0d0d"); }

  // ── Parâmetros recebidos ─────────────────────────────────────────
  const params    = new URLSearchParams(window.location.search);
  const mediaType = params.get("type")  || "movie";
  const tmdbId    = params.get("id")    || "";
  const season    = params.get("s")     || "1";
  const episode   = params.get("e")     || "1";
  const title     = decodeURIComponent(params.get("title") || "");
  const subInfo   = mediaType === "tv"
    ? `T${season.padStart(2,"0")} · E${episode.padStart(2,"0")}` : "";

  document.getElementById("media-title").textContent = title || "Player";
  document.getElementById("media-sub").textContent   = subInfo;

  // ── DEBUG ────────────────────────────────────────────────────────
  const logs = [];
  function dbgLog(msg, type="inf") {
    const ts = new Date().toLocaleTimeString("pt-BR");
    logs.push({ ts, msg, type });
    const el = document.getElementById("dbg-events");
    const div = document.createElement("div");
    div.className = `de de-${type}`;
    div.textContent = `[${ts}] ${msg}`;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
    console.log(`[${type.toUpperCase()}] ${msg}`);
  }
  function updateDebugInfo() {
    document.getElementById("dbg-info").textContent =
      `type: ${mediaType}\nid: ${tmdbId}\nseason: ${season}\nepisode: ${episode}\ntitle: ${title}\n\nURL atual:\n${buildUrl(currentProvider)}`;
  }
  function toggleDebug() {
    document.getElementById("dbg-panel").classList.toggle("open");
    updateDebugInfo();
  }
  function clearDebug() {
    document.getElementById("dbg-events").innerHTML = "";
    logs.length = 0;
  }

  // ── Capturar erros globais ───────────────────────────────────────
  window.onerror = (msg, src, line, col, err) => {
    dbgLog(`JS ERROR: ${msg} @ ${src}:${line}`, "err");
  };
  window.onunhandledrejection = (e) => {
    dbgLog(`PROMISE REJECT: ${e.reason}`, "err");
  };

  // ── URLs dos players ─────────────────────────────────────────────
  function buildUrl(provider) {
    switch (provider) {
      case "warezcdn":
        if (mediaType === "movie")
          return `https://warezcdn.site/filme/${tmdbId}`;
        return `https://warezcdn.site/serie/${tmdbId}/${season}/${episode}`;
      case "superflix":
        if (mediaType === "movie")
          return `https://superflixapi.online/filme/${tmdbId}`;
        return `https://superflixapi.online/serie/${tmdbId}/${season}/${episode}`;
      default:
        return "";
    }
  }

  // ── Estado ───────────────────────────────────────────────────────
  let currentProvider = "warezcdn";
  let loadTimer = null;
  let loadStart = null;

  const frame   = document.getElementById("player-frame");
  const loading = document.getElementById("loading");
  const errScr  = document.getElementById("error-screen");

  function showLoading() {
    loading.classList.remove("hidden");
    errScr.classList.remove("visible");
  }
  function hideLoading() { loading.classList.add("hidden"); }
  function showError()   { hideLoading(); errScr.classList.add("visible"); }

  function loadPlayer(provider) {
    const url = buildUrl(provider);
    dbgLog(`loadPlayer(${provider})`, "inf");
    dbgLog(`URL: ${url}`, "inf");

    if (!url || !tmdbId) {
      dbgLog(`ABORT: url ou tmdbId vazio (tmdbId="${tmdbId}")`, "err");
      showError();
      return;
    }

    showLoading();
    clearTimeout(loadTimer);
    loadStart = Date.now();

    // Verificar se URL é acessível antes de carregar no iframe
    fetch(url, { method: "HEAD", mode: "no-cors" })
      .then(() => dbgLog(`fetch HEAD ok (no-cors, não confirma status)`, "warn"))
      .catch(e => dbgLog(`fetch HEAD falhou: ${e.message}`, "err"));

    frame.src = url;
    dbgLog(`iframe.src definido`, "inf");

    loadTimer = setTimeout(() => {
      if (!loading.classList.contains("hidden")) {
        const elapsed = ((Date.now() - loadStart) / 1000).toFixed(1);
        dbgLog(`TIMEOUT após ${elapsed}s — iframe não disparou onload`, "warn");
        hideLoading();
      }
    }, 15000);
  }

  function switchProvider(provider) {
    if (provider === currentProvider) return;
    dbgLog(`switchProvider: ${currentProvider} → ${provider}`, "inf");
    currentProvider = provider;
    document.querySelectorAll(".provider-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.provider === provider);
    });
    loadPlayer(provider);
  }

  // ── Eventos do iframe ────────────────────────────────────────────
  frame.addEventListener("load", () => {
    clearTimeout(loadTimer);
    const elapsed = loadStart ? ((Date.now() - loadStart) / 1000).toFixed(1) + "s" : "?";
    dbgLog(`iframe onload disparado (${elapsed})`, "ok");

    // Tenta detectar se carregou uma página de erro (404, etc.)
    try {
      const doc = frame.contentDocument || frame.contentWindow?.document;
      if (doc) {
        const bodyText = doc.body?.innerText?.substring(0, 200) || "";
        const statusText = doc.title || "";
        dbgLog(`iframe title: "${statusText}"`, "inf");
        if (bodyText) dbgLog(`iframe body (200 chars): ${bodyText}`, "warn");
      }
    } catch(e) {
      // Cross-origin — normal, não é erro
      dbgLog(`cross-origin: não consegue ler conteúdo do iframe (normal)`, "inf");
    }

    hideLoading();
  });

  frame.addEventListener("error", (e) => {
    clearTimeout(loadTimer);
    dbgLog(`iframe onerror: ${JSON.stringify(e.type)}`, "err");
    showError();
  });

  // ── Botões ───────────────────────────────────────────────────────
  document.getElementById("try-alt-btn").addEventListener("click", () => {
    const next = currentProvider === "warezcdn" ? "superflix" : "warezcdn";
    switchProvider(next);
    document.querySelectorAll(".provider-btn").forEach(btn =>
      btn.classList.toggle("active", btn.dataset.provider === next));
  });

  document.getElementById("close-btn").addEventListener("click", () => {
    if (tg) tg.close();
  });

  // ── Inicializar ───────────────────────────────────────────────────
  dbgLog(`Iniciando — type=${mediaType} id=${tmdbId} s=${season} e=${episode}`, "inf");
  if (tmdbId) {
    loadPlayer("warezcdn");
  } else {
    dbgLog(`ERRO: tmdbId vazio! params: ${window.location.search}`, "err");
    showError();
  }
</script>
</body>
</html>
